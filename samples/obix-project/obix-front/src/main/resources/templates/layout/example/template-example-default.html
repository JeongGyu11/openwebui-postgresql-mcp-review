<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" lang="ko">
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <meta name="description" content="">
  <meta name="author" content="">

  <title layout:title-pattern="$LAYOUT_TITLE - $CONTENT_TITLE">Finance All Solutions</title>

  <th:block layout:include="~{/layout/fragment/html-head.html :: HtmlHead}"></th:block>
</head>

<body id="page-top">
<th:block layout:fragment="Header"></th:block>

  <!-- Page Wrapper -->
  <div id="wrapper">

    <!-- Sidebar -->
    <th:block layout:include="~{/layout/fragment/sidebar.html :: SideBar}"></th:block>
    <!-- End of Sidebar -->

    <!-- Content Wrapper -->
    <div id="content-wrapper" class="d-flex flex-column">

      <!-- Main Content -->
      <div id="content">

		  <!-- Topbar -->
          <th:block layout:include="~{/layout/fragment/topbar.html :: TopBar}"></th:block>
		  <!-- End of Topbar -->

		  <!-- Begin Page Content -->
		  <div class="container-fluid">

			  <!-- 여기부터 컨텐츠 -->
			  <th:block layout:fragment="Content"></th:block>
			  <!-- 여기까지 컨텐츠 -->

		  </div>
		  <!-- /.container-fluid -->
      </div>
      <!-- End of Main Content -->

      <!-- Footer -->
      <th:block layout:include="~{/layout/fragment/footer.html :: Footer}"></th:block>
      <!-- End of Footer -->

    </div>
    <!-- End of Content Wrapper -->

  </div>
  <!-- End of Page Wrapper -->

  <!-- Scroll to Top Button-->
  <a class="scroll-to-top rounded" href="#page-top">
    <i class="fas fa-angle-up"></i>
  </a>

  <!-- Logout Modal-->
  <div class="modal fade" id="logoutModal" tabindex="-1" role="dialog" aria-labelledby="exampleModalLabel" aria-hidden="true">
	  <div class="modal-dialog" role="document">
		  <div class="modal-content">
			  <div class="modal-header">
				  <h5 class="modal-title" id="exampleModalLabel">Ready to Leave?</h5>
				  <button class="close" type="button" data-dismiss="modal" aria-label="Close"><span aria-hidden="true">×</span></button>
			  </div>
			  <div class="modal-body">Select "Logout" below if you are ready to end your current session.</div>
			  <div class="modal-footer">
				  <button class="btn btn-secondary" type="button" data-dismiss="modal">Cancel</button>
				  <a class="btn btn-primary" href="/example/login.view">Logout</a>
			  </div>
		  </div>
	  </div>
  </div>

<!-- Bootstrap core JavaScript-->
<script th:inline="javascript" th:src="@{/static/vendor/jquery/jquery.min.js}"></script>
<script th:inline="javascript" th:src="@{/static/vendor/bootstrap/js/bootstrap.bundle.min.js}"></script>

<!-- Core plugin JavaScript-->
<script th:inline="javascript" th:src="@{/static/vendor/jquery-easing/jquery.easing.min.js}"></script>

<!-- Custom scripts for all pages-->
<script th:inline="javascript" th:src="@{/static/js/sb-admin-2.min.js}"></script>

<th:block layout:fragment="Footer"></th:block>
</body>

</html>
