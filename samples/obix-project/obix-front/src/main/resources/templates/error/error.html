<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
	  xmlns:th="http://www.thymeleaf.org"
	  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	  layout:decorate="~{/layout/example/template-example-default}"
	  xmlns:obix="http://obix.fasol.co.kr/thymeleaf/layout"
	  lang="ko">

<th:block layout:fragment="Content">

	<!-- 404 Error Text -->
	<div class="text-center">
		<div class="error mx-auto" data-text="500">500</div>
		<p class="lead text-gray-800 mb-5" th:text="${ERROR_CODE}"></p>
		<p class="text-gray-500 mb-0" th:text="${ERROR_MESSAGE}"></p>
		<a href="/example/index.view">&larr; Back to Dashboard</a>
	</div>

</th:block>
</html>
