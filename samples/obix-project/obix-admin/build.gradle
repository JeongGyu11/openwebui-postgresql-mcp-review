apply plugin: 'io.spring.dependency-management'
apply plugin: 'org.springframework.boot'
apply plugin: 'java-library'
apply plugin: 'java'
apply plugin: 'idea'
apply plugin: 'eclipse'
apply plugin: 'war'


idea {
    module {
        contentRoot = file("${project.projectDir}/src/main/webapp")
    }
}

eclipse {
    wtp {
        component {
            contextPath = '/'
        }
    }
}

sourceSets {
    main {
        // resources 디렉토리 재정의
        resources {
            // 리소스 파일을 소스 코드 디렉토리에서 관리하도록 설정
            srcDir "${project.projectDir}/src/main/java"

            // Java 소스 파일은 리소스에 포함하지 않도록 제외 설정
            exclude "**/*.java"
        }
    }
}


dependencies {
    implementation project(':obix-common')

    implementation("org.springframework.boot:spring-boot-starter-web:$springBootVersion") {
        exclude group: 'org.springframework.boot', module: 'spring-boot-starter-logging'
        exclude group: 'org.springframework.boot', module: 'spring-boot-starter-tomcat'
    }
    implementation "org.springframework.boot:spring-boot-starter-data-rest:$springBootVersion"
    implementation "org.springframework.boot:spring-boot-starter-security:$springBootVersion"
    implementation "org.springframework.boot:spring-boot-starter-data-jpa:$springBootVersion"

    // JASYPT: Java Simplified Encryption
    implementation group: 'com.github.ulisesbocchio', name: 'jasypt-spring-boot-starter', version: '3.0.5'

    // SiteMesh Template
    implementation group: 'org.sitemesh', name: 'sitemesh', version: '3.2.1'

    // Thymeleaf
    implementation "org.springframework.boot:spring-boot-starter-thymeleaf:$springBootVersion"
    implementation group: 'nz.net.ultraq.thymeleaf', name: 'thymeleaf-layout-dialect', version: '3.3.0'

    // EhCache
    implementation "org.springframework.boot:spring-boot-starter-cache:$springBootVersion"
    implementation group: 'org.ehcache', name: 'ehcache', version: '3.10.8'

    // common utils
    implementation group: 'org.apache.commons', name: 'commons-fileupload2-jakarta-servlet6', version: '2.0.0-M2'
    implementation group: 'commons-beanutils', name: 'commons-beanutils', version: '1.10.0'

    // EL Tag
    implementation group: 'jakarta.servlet.jsp.jstl', name: 'jakarta.servlet.jsp.jstl-api', version: '3.0.2'
    implementation group: 'org.glassfish.web', name: 'jakarta.servlet.jsp.jstl', version: '3.0.1'
    implementation group: 'jakarta.el', name: 'jakarta.el-api', version: '6.0.1'

    // Tomcat embeded
    providedRuntime "org.apache.tomcat.embed:tomcat-embed-core:$tomcatVersion"
    providedRuntime "org.apache.tomcat.embed:tomcat-embed-el:$tomcatVersion"
    compileOnly "org.apache.tomcat.embed:tomcat-embed-jasper:$tomcatVersion"
    providedRuntime "org.apache.tomcat.embed:tomcat-embed-websocket:$tomcatVersion"

    compileOnly group: 'jakarta.servlet', name: 'jakarta.servlet-api', version: '6.1.0'

    implementation("com.googlecode.log4jdbc:log4jdbc:1.2") {
        exclude group: 'slf4j-api', module: 'org.slf4j'
    }

    // Swagger-UI
    implementation group: 'org.springdoc', name: 'springdoc-openapi-starter-webmvc-ui', version: '2.6.0'

    implementation "org.springframework.boot:spring-boot-starter-actuator:$springBootVersion"

    // Hot Swaping
    compileOnly "org.springframework.boot:spring-boot-devtools:$springBootVersion"

}
